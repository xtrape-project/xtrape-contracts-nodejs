name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  dependency-audit:
    runs-on: docker
    needs: validate
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (fail on high/critical in production deps)
        # Audit must query the canonical public advisory DB, not whatever
        # registry the runner is globally configured for. The internal
        # Forgejo npm registry mirror does not implement the audit endpoint
        # (/-/npm/v1/security/audits), so an inherited registry makes this
        # step fail on a transport error rather than on a real advisory.
        run: pnpm audit --prod --audit-level=high --registry https://registry.npmjs.org/

  secret-scan:
    runs-on: docker
    needs: dependency-audit
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Secret scan (secretlint, working tree)
        # gitleaks ships only as a github.com release, which this runner has
        # no egress to (verified with a download-only probe); secretlint comes
        # from npm, which the runner CAN reach.
        #
        # The scanner is a pinned devDependency resolved through
        # pnpm-lock.yaml, NOT fetched ad hoc at run time: a supply-chain gate
        # must not itself execute remote code that bypasses the lockfile and
        # the repo's own dependency review. Rules come from .secretlintrc.json.
        #
        # Scan exactly the git-tracked files. That is the gate's actual
        # question ("did a secret get committed?"), and it keeps the run
        # deterministic and fast: a "**/*" glob depends on ignore-file
        # discovery and otherwise walks installed node_modules (~6.5k files,
        # full of third-party test fixtures) instead of the ~112 tracked ones.
        run: git ls-files -z | xargs -0 pnpm exec secretlint
